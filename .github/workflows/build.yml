name: Build SAKAPAY APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Setup Scaffold & Compile APK
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          cp custom_manifest.xml /tmp/backup/

          # Inisialisasi scaffolding Android
          flutter create --platforms=android --org com.sakapay.app .

          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          cp /tmp/backup/custom_manifest.xml android/app/src/main/AndroidManifest.xml

          # Set minimum SDK ke 21 (syarat ML Kit)
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true

          # Tambahkan aturan ProGuard untuk Google ML Kit
          cat << 'EOF_PROGUARD' > android/app/proguard-rules.pro
          -dontwarn com.google.mlkit.**
          -keep class com.google.mlkit.** { *; }
          -dontwarn androidx.**
          -keep class io.flutter.** { *; }
          EOF_PROGUARD

          flutter pub get
          # Compile APK
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAKAPAY-Struk-App
          path: build/app/outputs/flutter-apk/*.apk
